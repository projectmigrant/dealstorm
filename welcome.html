<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歡迎加入 AI-Coding 無痛上手</title>
  <style>
    :root {
      --bg: #f7f5f0;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #5f6670;
      --accent: #d9774b;
      --accent-soft: #fbe9df;
      --border: #e6e1d8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --card: #1f2227;
        --text: #ecedee;
        --muted: #a0a6ad;
        --accent: #f0915f;
        --accent-soft: #3a2a22;
        --border: #2e3238;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }
    main {
      max-width: 680px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
      animation: rise 0.7s ease-out;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .badge {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: clamp(28px, 6vw, 40px);
      line-height: 1.3;
      margin-bottom: 16px;
    }
    h1 span { color: var(--accent); }
    .lead {
      color: var(--muted);
      font-size: 18px;
      margin-bottom: 36px;
    }
    h2 {
      font-size: 18px;
      margin-bottom: 16px;
    }
    ol {
      list-style: none;
      counter-reset: step;
      margin-bottom: 36px;
    }
    li {
      counter-increment: step;
      display: flex;
      gap: 14px;
      padding: 14px 0;
      border-top: 1px solid var(--border);
    }
    li::before {
      content: counter(step);
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }
    li strong { display: block; }
    li p { color: var(--muted); font-size: 15px; }
    button {
      font: inherit;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    button.secondary {
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
    }
    .confetti {
      position: fixed;
      top: -20px;
      font-size: 24px;
      pointer-events: none;
      animation: fall linear forwards;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(540deg); opacity: 0.6; }
    }
    #fireworks {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    #welcome-banner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      font-size: clamp(32px, 8vw, 64px);
      font-weight: 800;
      color: var(--accent);
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      z-index: 11;
      transition: opacity 0.5s, transform 0.5s;
    }
    #welcome-banner.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    #message {
      margin-top: 16px;
      color: var(--accent);
      font-weight: 600;
      min-height: 1.7em;
    }
    @media (max-width: 480px) {
      main { padding: 32px 22px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">🎉 新同學報到</div>
    <h1>歡迎加入<br><span>AI-Coding 無痛上手</span></h1>
    <p class="lead">
      很高興你來了！不需要任何程式背景，接下來我們會一步一步，
      讓 AI 成為你的寫程式夥伴，把腦中的點子變成真的作品。
    </p>

    <h2>你的旅程從這裡開始</h2>
    <ol>
      <li>
        <div>
          <strong>認識 AI 助手</strong>
          <p>學會如何用自然語言跟 AI 溝通，讓它聽懂你想做什麼。</p>
        </div>
      </li>
      <li>
        <div>
          <strong>動手做第一個作品</strong>
          <p>就像這個網頁一樣——一句話，AI 幫你寫出來。</p>
        </div>
      </li>
      <li>
        <div>
          <strong>修改、除錯、再進化</strong>
          <p>不怕出錯，學會和 AI 一起把作品越改越好。</p>
        </div>
      </li>
    </ol>

    <div class="actions">
      <button id="start">我準備好了！</button>
      <button id="celebrate" class="secondary">🎉 慶祝一下</button>
      <button id="fireworks-btn" class="secondary">🎆 放煙火</button>
    </div>
    <p id="message"></p>
  </main>

  <canvas id="fireworks"></canvas>
  <div id="welcome-banner">歡迎加入！🎉</div>

  <script>
    const messages = [
      "太棒了！一起出發吧 🚀",
      "每個高手都是從第一行程式開始的 ✨",
      "記得：遇到問題，就問 AI 💬",
      "你已經完成第一步了 🎯"
    ];
    let i = 0;
    document.getElementById("start").addEventListener("click", () => {
      document.getElementById("message").textContent = messages[i % messages.length];
      i++;
    });

    const emojis = ["🎉", "✨", "🎊", "💻", "🚀", "⭐"];
    document.getElementById("celebrate").addEventListener("click", () => {
      for (let n = 0; n < 40; n++) {
        const piece = document.createElement("span");
        piece.className = "confetti";
        piece.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.animationDuration = 2 + Math.random() * 2 + "s";
        piece.style.animationDelay = Math.random() * 0.5 + "s";
        document.body.appendChild(piece);
        piece.addEventListener("animationend", () => piece.remove());
      }
    });

    // 煙火
    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");
    const banner = document.getElementById("welcome-banner");
    const colors = ["#ff5e5e", "#ffd25e", "#5effa1", "#5ec8ff", "#c55eff", "#ff9a5e"];
    let rockets = [];
    let sparks = [];
    let running = false;
    let bannerTimer;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    function launch() {
      rockets.push({
        x: canvas.width * (0.2 + Math.random() * 0.6),
        y: canvas.height,
        vy: -(canvas.height / 60) * (0.9 + Math.random() * 0.3),
        targetY: canvas.height * (0.15 + Math.random() * 0.3),
        color: colors[Math.floor(Math.random() * colors.length)]
      });
      if (!running) {
        running = true;
        requestAnimationFrame(tick);
      }
    }

    function explode(x, y, color) {
      for (let n = 0; n < 80; n++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 5;
        sparks.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          color: Math.random() < 0.8 ? color : "#ffffff"
        });
      }
    }

    function tick() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      rockets = rockets.filter(r => {
        r.y += r.vy;
        r.vy *= 0.98;
        ctx.fillStyle = r.color;
        ctx.beginPath();
        ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
        ctx.fill();
        if (r.y <= r.targetY || r.vy > -1) {
          explode(r.x, r.y, r.color);
          return false;
        }
        return true;
      });

      sparks = sparks.filter(s => {
        s.x += s.vx;
        s.y += s.vy;
        s.vx *= 0.97;
        s.vy = s.vy * 0.97 + 0.06;
        s.life -= 0.012;
        ctx.globalAlpha = Math.max(s.life, 0);
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, 2.2, 0, Math.PI * 2);
        ctx.fill();
        return s.life > 0;
      });
      ctx.globalAlpha = 1;

      if (rockets.length || sparks.length) {
        requestAnimationFrame(tick);
      } else {
        running = false;
      }
    }

    function showFireworks() {
      for (let n = 0; n < 6; n++) {
        setTimeout(launch, n * 350);
      }
      banner.classList.add("show");
      clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => banner.classList.remove("show"), 3000);
    }

    document.getElementById("fireworks-btn").addEventListener("click", showFireworks);

    // 一打開頁面就放煙火
    window.addEventListener("load", () => setTimeout(showFireworks, 500));
  </script>
</body>
</html>
